apply plugin: 'eclipse'

archivesBaseName = 'WorldEdit-Core-WDG'

dependencies {
    compile 'de.schlichtherle:truezip:6.8.3'
    compile 'rhino:js:1.7R2'
    compile 'org.yaml:snakeyaml:1.9'
    compile 'com.google.guava:guava:17.0'
    compile 'com.sk89q:jchronic:0.2.4a'
    compile 'com.google.code.findbugs:jsr305:1.3.9'
    compile 'com.thoughtworks.paranamer:paranamer:2.6'
    compile 'com.google.code.gson:gson:2.2.4'
    compile 'com.sk89q.lib:jlibnoise:1.0.0'
    testCompile 'org.mockito:mockito-core:1.9.0-rc1'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'src/legacy/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'WorldEdit Core WDG Edition',
                'Implementation-Version': project.version,
                'WorldEdit-Git-Commit': rootProject.gitCommitHash
        )
    }
}

build.dependsOn shadowJar
